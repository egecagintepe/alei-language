[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "alei-language"
version = "0.1.0"
description = "Tools for the Alei Language Project working standard"
requires-python = ">=3.11"
[project.scripts]
alei = "alei_language.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
